<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Football Predictor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">⚽ Football Predictor</div>
    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-tab="classifica" role="tab" aria-selected="true">Classifica</button>
      <button class="tab" data-tab="pronostico" role="tab" aria-selected="false">Pronostico</button>
      <button class="tab" data-tab="sistemi" role="tab" aria-selected="false">Sistemi</button>
    </nav>
  </header>

  <main class="container">

    <section id="panel-classifica" class="panel is-active" role="tabpanel">
      <div class="card">
        <h2>Sincronizza classifica</h2>
        <form id="form-sync-standings" class="form-row">
          <label>Campionato
            <input type="text" name="competition" placeholder="premier-league" required>
          </label>
          <label>Stagione <span class="hint">(opzionale)</span>
            <input type="text" name="season" placeholder="premier-league-2026">
          </label>
          <button type="submit">Sincronizza</button>
        </form>
        <p id="sync-status" class="status"></p>
      </div>

      <div class="card">
        <h2>Classifica salvata</h2>
        <form id="form-view-standings" class="form-row">
          <label>Season ID
            <input type="text" name="season" placeholder="premier-league-2026" required>
          </label>
          <button type="submit">Mostra</button>
        </form>
        <div id="standings-table" class="table-wrap"></div>
      </div>
    </section>

    <section id="panel-pronostico" class="panel" role="tabpanel">
      <div class="card">
        <h2>Pronostico 1X2</h2>
        <form id="form-predict" class="form-grid">
          <label>Squadra casa
            <input type="text" name="home" placeholder="Arsenal" required>
          </label>
          <label>ID squadra casa (ESPN)
            <input type="text" name="home_id" placeholder="359" required>
          </label>
          <label>Squadra trasferta
            <input type="text" name="away" placeholder="Chelsea" required>
          </label>
          <label>ID squadra trasferta (ESPN)
            <input type="text" name="away_id" placeholder="363" required>
          </label>
          <label>Season ID <span class="hint">(per il fallback su classifica)</span>
            <input type="text" name="season" placeholder="premier-league-2026">
          </label>
          <button type="submit">Calcola probabilità</button>
        </form>
        <p class="hint">Trova gli ID squadra con: <code>sports-skills football search_team --query="Nome"</code></p>
        <div id="predict-result"></div>
      </div>
    </section>

    <section id="panel-sistemi" class="panel" role="tabpanel">
      <div class="card">
        <h2>Genera sistema</h2>
        <form id="form-system" class="form-grid">
          <label>Modalità
            <select name="mode" id="system-mode">
              <option value="integrale">Integrale</option>
              <option value="ridotto">Ridotto</option>
            </select>
          </label>
          <label>Puntata per colonna
            <input type="number" name="stake" value="1" min="0" step="0.5">
          </label>
          <label class="row-min-correct" style="display:none">Minimo garantito
            <input type="number" name="min_correct" min="1" step="1">
          </label>
          <label class="span-2">Pronostici (uno per riga: es. "1X" oppure "1X = Arsenal-Chelsea")
            <textarea name="picks_raw" rows="6" placeholder="1X = Arsenal-Chelsea&#10;1 = City-Everton&#10;12 = Napoli-Lazio" required></textarea>
          </label>
          <button type="submit">Genera sistema</button>
        </form>
        <div id="system-result"></div>
      </div>
    </section>

  </main>

  <footer class="disclaimer">{{ disclaimer }}</footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
